# The cloud topology: the app, its migrations, the worker and beat on one host, with
# managed PostgreSQL, Redis, S3/R2 and SMTP. Start it only through the wrapper:
#   scripts/spaceworks-compose.sh cloud up -d
# which reads the static settings from /etc/spaceworks-organization/cloud.env
# (SWO_STATIC_ENV_FILE overrides; start from .env.production.example).
# HTTPS is terminated in front of APP_PORT by your platform or reverse proxy.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-restart: &default-restart unless-stopped
x-backend-image: &backend-image "${SWO_BACKEND_IMAGE:-ghcr.io/spaceworks-labs/spaceworks-organization-backend}:${SWO_IMAGE_TAG:-latest}"
x-app-env: &app-env
  NODE_ENV: production
  AUTH_URL: ${PUBLIC_APP_BASE_URL:?set PUBLIC_APP_BASE_URL}
  NEXT_PUBLIC_BASE_URL: ${PUBLIC_APP_BASE_URL:?set PUBLIC_APP_BASE_URL}
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-monolith}
  FRONTEND_GATEWAY_SECRET: ${FRONTEND_GATEWAY_SECRET:-}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
  DIRECT_URL: ${DIRECT_URL:-}
  REDIS_URL: ${REDIS_URL:?set REDIS_URL}
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
  CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
  INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
  INNGEST_JOBS_CRON: ${INNGEST_JOBS_CRON:-}
  INNGEST_DEV: ${INNGEST_DEV:-}
  HEALTHCHECK_SECRET: ${HEALTHCHECK_SECRET:?set HEALTHCHECK_SECRET}
  NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?set NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
  PAYMENT_SECRETS_KEY: ${PAYMENT_SECRETS_KEY:?set PAYMENT_SECRETS_KEY}
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?set SUPER_ADMIN_EMAIL}
  PWNED_PASSWORDS_CHECK: ${PWNED_PASSWORDS_CHECK:-1}
  TRUSTED_PROXY_IP_HEADER: ${TRUSTED_PROXY_IP_HEADER:?set TRUSTED_PROXY_IP_HEADER}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
  NEXT_PUBLIC_HOSTED_BY: ${NEXT_PUBLIC_HOSTED_BY:-}
  LANDING_ENABLED: ${LANDING_ENABLED:-true}
  WEB_TELEMETRY_ALLOWED_ORIGINS: ${WEB_TELEMETRY_ALLOWED_ORIGINS:-}
  WEB_TELEMETRY_MIXPANEL_TOKEN: ${WEB_TELEMETRY_MIXPANEL_TOKEN:-}
  WEB_TELEMETRY_MIXPANEL_API_HOST: ${WEB_TELEMETRY_MIXPANEL_API_HOST:-}
  WEB_TELEMETRY_MIXPANEL_SDK_HOST: ${WEB_TELEMETRY_MIXPANEL_SDK_HOST:-}
  AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
  AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
  AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
  AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
  LOGIN_METHODS: ${LOGIN_METHODS:-}
  AUTH_APPLE_ID: ${AUTH_APPLE_ID:-}
  AUTH_APPLE_TEAM_ID: ${AUTH_APPLE_TEAM_ID:-}
  AUTH_APPLE_KEY_ID: ${AUTH_APPLE_KEY_ID:-}
  AUTH_APPLE_PRIVATE_KEY: ${AUTH_APPLE_PRIVATE_KEY:-}
  AUTH_SUPABASE_URL: ${AUTH_SUPABASE_URL:-}
  AUTH_SUPABASE_ANON_KEY: ${AUTH_SUPABASE_ANON_KEY:-}
  AUTH_SUPABASE_PROVIDERS: ${AUTH_SUPABASE_PROVIDERS:-}
  AUTH_FIREBASE_API_KEY: ${AUTH_FIREBASE_API_KEY:-}
  AUTH_FIREBASE_AUTH_DOMAIN: ${AUTH_FIREBASE_AUTH_DOMAIN:-}
  AUTH_FIREBASE_PROJECT_ID: ${AUTH_FIREBASE_PROJECT_ID:-}
  AUTH_FIREBASE_APP_ID: ${AUTH_FIREBASE_APP_ID:-}
  AUTH_FIREBASE_PROVIDERS: ${AUTH_FIREBASE_PROVIDERS:-}
  EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SERVICE: ${SMTP_SERVICE:-}
  SMTP_ALLOW_UNAUTHENTICATED: ${SMTP_ALLOW_UNAUTHENTICATED:-0}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  AWS_SES_REGION: ${AWS_SES_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  SES_TOPIC_ARN: ${SES_TOPIC_ARN:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
  POSTMARK_MESSAGE_STREAM: ${POSTMARK_MESSAGE_STREAM:-outbound}
  EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
  SMS_PROVIDER: ${SMS_PROVIDER:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
  TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
  TWILIO_FROM: ${TWILIO_FROM:-}
  TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
  MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
  MSG91_SENDER_ID: ${MSG91_SENDER_ID:-}
  MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
  SMS_WEBHOOK_SECRET: ${SMS_WEBHOOK_SECRET:-}
  SMS_DAILY_COUNTRY_CAP: ${SMS_DAILY_COUNTRY_CAP:-}
  MESSAGING_MATTERMOST_HOSTS: ${MESSAGING_MATTERMOST_HOSTS:-}
  MESSAGE_LOG_RETENTION_DAYS: ${MESSAGE_LOG_RETENTION_DAYS:-}
  OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-30}
  JOBS_QUEUE_PREFIX: ${JOBS_QUEUE_PREFIX:-swo:jobs}
  QUEUE_OUTBOX_CONCURRENCY: ${QUEUE_OUTBOX_CONCURRENCY:-5}
  QUEUE_SCHEDULED_CONCURRENCY: ${QUEUE_SCHEDULED_CONCURRENCY:-2}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_REGION: ${S3_REGION:-auto}
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-1}
  BACKUP_PROVIDER: ${BACKUP_PROVIDER:-}
  BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
services:
  # The backend image's migrate role, on the direct (non-pooled) connection;
  # DATABASE_URL may be a transaction pooler.
  migrate:
    image: *backend-image
    command: ["--role", "migrate"]
    restart: "no"
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:-}
  backend:
    image: *backend-image
    command: ["--role", "backend", "node", "server.js"]
    restart: *default-restart
    logging: *default-logging
    environment: *app-env
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:3000"
    depends_on:
      migrate: {condition: service_completed_successfully}
  # BullMQ worker. Runs every queued job: outbox delivery and the registry in lib/queue/registry.ts.
  worker:
    image: *backend-image
    command: ["--role", "worker", "node", "dist/worker.js"]
    restart: *default-restart
    logging: *default-logging
    stop_grace_period: 2m
    environment:
      <<: *app-env
      JOBS_HEALTH_PORT: "3460"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3460/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}
  # BullMQ beat. Keeps the repeatable job schedules in Redis (membership sweep and outbox relay every minute, ...).
  beat:
    image: *backend-image
    command: ["--role", "beat", "node", "dist/beat.js"]
    restart: *default-restart
    logging: *default-logging
    stop_grace_period: 2m
    environment:
      <<: *app-env
      JOBS_HEALTH_PORT: "3460"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3460/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}
  # Operator checks, run on demand: scripts/spaceworks-compose.sh cloud run --rm ops
  ops:
    image: *backend-image
    profiles: [tools]
    command: ["--role", "ops", "node", "docker/ops/check.mjs"]
    environment:
      <<: *app-env
      SWO_TOPOLOGY: cloud
